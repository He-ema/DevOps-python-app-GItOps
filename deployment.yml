apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app:1.0.0-24
  labels:
    app: python-app:1.0.0-24
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app:1.0.0-24
  template:
    metadata:
      labels:
        app: python-app:1.0.0-24
    spec:
      containers:
        - name: python-app:1.0.0-24
          image: ohema/python-app:1.0.0-24
          ports:
            - containerPort: 5000
